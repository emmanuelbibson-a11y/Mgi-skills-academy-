
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGI Payment Confirmation</title>
</head>
<body>
  <h2>Checking your payment...</h2>
  <p id="message">Please wait while we verify your payment.</p>

  <script>
    async function verifyPayment() {
      const params = new URLSearchParams(window.location.search);
      const reference = params.get("reference") || params.get("trxref");

      const message = document.getElementById("message");

      if (!reference) {
        message.textContent = "Payment reference not found.";
        return;
      }

      try {
        const response = await fetch("/api/verify-payment", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ reference })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.error || "Payment verification failed.");
        }

        message.textContent =
          "Payment verified successfully! Course: " +
          result.course +
          ". Please wait for course access confirmation.";

      } catch (error) {
        message.textContent = error.message +
          " Please contact MGI Skills Academy.";
      }
    }

    verifyPayment();
  </script>
</body>
</html>
